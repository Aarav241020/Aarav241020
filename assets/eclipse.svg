<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#141633"/>
      <stop offset="0.55" stop-color="#090a1c"/>
      <stop offset="1" stop-color="#030308"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0.38" stop-color="#fff6dc" stop-opacity="1"/>
      <stop offset="0.46" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="0.62" stop-color="#c9a2ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b5bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.8" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#ffbe5c"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#14152a"/>
      <stop offset="1" stop-color="#040409"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1000" height="340" rx="18" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e9e6ff">
    <circle cx="62" cy="48" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="210" r="0.9"><animate attributeName="opacity" values=".3;1;.3" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="92" r="1.5"><animate attributeName="opacity" values="1;.4;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="290" r="1.1"><animate attributeName="opacity" values=".5;1;.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="30" r="0.8"><animate attributeName="opacity" values="1;.2;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="250" r="1.3"><animate attributeName="opacity" values=".2;.9;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="35" cy="160" r="0.9"><animate attributeName="opacity" values=".8;.2;.8" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="372" cy="70" r="1"><animate attributeName="opacity" values="1;.3;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="44" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="262" r="0.9"><animate attributeName="opacity" values="1;.3;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="768" cy="110" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="838" cy="36" r="0.8"><animate attributeName="opacity" values="1;.2;1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="182" r="1.2"><animate attributeName="opacity" values=".6;1;.6" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="76" r="1"><animate attributeName="opacity" values="1;.4;1" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="872" cy="300" r="1.1"><animate attributeName="opacity" values=".2;.8;.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="300" r="0.8"><animate attributeName="opacity" values="1;.3;1" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="305" r="0.9"><animate attributeName="opacity" values=".4;1;.4" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="22" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="40" r="0.7"/><circle cx="180" cy="150" r="0.7"/><circle cx="820" cy="215" r="0.7"/>
    <circle cx="730" cy="170" r="0.6"/><circle cx="250" cy="180" r="0.6"/><circle cx="930" cy="250" r="0.7"/>
  </g>

  <!-- the eclipse: moon drifts across, corona blooms at totality -->
  <g transform="translate(500 140)">
    <circle r="150" fill="url(#corona)" filter="url(#blur)" opacity=".15">
      <animate attributeName="opacity" values=".12;.12;1;1;.12;.12" keyTimes="0;.25;.45;.7;.9;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="150;156;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="url(#sun)"/>
    <circle r="61" fill="url(#moon)" stroke="#ffffff" stroke-opacity=".06" cx="-210">
      <animate attributeName="cx" values="-210;-210;0;0;210;210" keyTimes="0;.1;.45;.7;1;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.6 0 .8 1;0 0 1 1"/>
    </circle>
    <!-- diamond ring: a flash of sunlight as totality begins and ends -->
    <g opacity="0">
      <circle cx="-44" cy="-42" r="7" fill="#fff" filter="url(#soft)"/>
      <circle cx="-44" cy="-42" r="20" fill="#fff6dc" opacity=".35" filter="url(#blur)"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.4;.44;.48;1" dur="14s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <circle cx="44" cy="42" r="7" fill="#fff" filter="url(#soft)"/>
      <circle cx="44" cy="42" r="20" fill="#fff6dc" opacity=".35" filter="url(#blur)"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.68;.72;.76;1" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="500" y="276" text-anchor="middle" font-family="'Segoe UI Light','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="300" font-size="34" letter-spacing="16" fill="#ece9ff">AARAV</text>
  <text x="500" y="308" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="5" fill="#9d97c9">AI AGENTS · SECURITY · BUILT AFTER DARK</text>
</svg>
