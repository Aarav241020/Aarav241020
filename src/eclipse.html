<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  #stage { width: 1200px; height: 420px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1200" height="420"></canvas></div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;
uniform float u;      // progress through the sequence 0..1
uniform float seed;   // per-frame film grain
#define PI 3.1415927
#define TAU 6.2831853

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float h31(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
float adiff(float a, float b){ return mod(a - b + PI, TAU) - PI; }

// a helmet streamer: a lobe that tapers and bends with distance
float streamer(float ang, float r, float at, float s, float bend, float w0){
  float dth = adiff(ang, at + bend * (1. - exp(1. - r)));
  float w = w0 / pow(r, .6) + .03;
  return s * exp(-dth * dth / (w * w)) * pow(r, -2.) * exp(-r * .18);
}
float prominence(float ang, float r, float at, float h, float w){
  float dth = adiff(ang, at) / w;
  float top = 1. + h * (1. - dth * dth) * (.75 + .5 * noise(vec3(ang * 90., r * 60., 7.)));
  return step(1., r) * (1. - smoothstep(top - .006, top, r)) * step(abs(dth), 1.);
}

void main(){
  vec2 frag = gl_FragCoord.xy, uv = frag / res;
  float R = 46.;
  // the sky turns: sun, moon and stars drift slowly together across the frame
  vec2 C = vec2(res.x * .5, res.y * .52) + vec2(44., 12.) * (u - .5);
  vec2 p = (frag - C) / R;
  float r = length(p), aa = 1.1 / R, ang = atan(p.y, p.x);
  vec2 dir = p / max(r, 1e-4);

  // twilight sky: deep navy, a little lighter toward the horizon, lens vignette
  vec3 col = mix(vec3(.04, .055, .1), vec3(.012, .018, .042), smoothstep(0., 1., uv.y));
  col *= 1. - .45 * pow(length((uv - .5) * vec2(1., .55)) * 1.35, 2.2);

  // a few stars and one bright planet, fixed to the sky
  vec2 sp = frag - C;
  vec2 g = floor(sp / 34.); float hs = h21(g + 11.);
  if (hs > .93) {
    vec2 st = (g + .25 + .5 * vec2(h21(g + 3.1), h21(g + 7.7))) * 34.;
    float tw = .75 + .25 * sin(u * 70. + hs * 300.);
    col += vec3(.8, .84, 1.) * exp(-dot(sp - st, sp - st) * 1.4) * (hs - .93) * 9. * tw;
  }
  vec2 venus = vec2(-330., 70.);
  col += vec3(1., .97, .9) * (exp(-dot(sp - venus, sp - venus) * .9) * 1.4 + exp(-length(sp - venus) * .35) * .05);

  // moon slides across the sun: diamond ring -> totality -> diamond ring
  float s = 2. * u - 1.;
  vec2 d = vec2(.075 * (.35 * s + .65 * s * s * s), .012 * s);       // lingers in totality, hurries at the contacts
  vec2 q = p - d; float rq = length(q), am = atan(q.y, q.x);
  float Rm = 1.024 * (1. + .006 * (noise(vec3(cos(am) * 16., sin(am) * 16., 0.)) - .5));   // lunar valleys -> Baily's beads
  float moon = 1. - smoothstep(Rm - aa, Rm + aa, rq);
  float sun = 1. - smoothstep(1. - aa, 1. + aa, r);
  float exposed = sun * (1. - moon);
  float flash = smoothstep(.02, .052, abs(d.x));

  // corona: K + F falloff, flattened toward the tilted solar equator, a few long streamers, polar plumes
  float th = ang - .35;
  float I = 1.4 * pow(r, -7.) + .5 * pow(r, -2.6);
  I *= .5 + .5 * pow(abs(cos(th)), 1.6);
  I += 1.3 * (streamer(ang, r, .12, 1., .10, .30) + streamer(ang, r, .66, .6, -.06, .22)
            + streamer(ang, r, 3.25, .9, -.09, .32) + streamer(ang, r, 3.78, .55, .07, .2)
            + streamer(ang, r, 2.05, .22, .05, .16) + streamer(ang, r, 5.2, .18, -.04, .14));
  float pole = pow(abs(sin(th)), 8.);
  I += pole * .5 * pow(r, -3.6) * smoothstep(.45, .8, noise(vec3(dir * 30., r * .35)));
  I *= .82 + .36 * fbm(vec3(dir * 16., r * .22 + 3.));                 // fine radial filaments
  I *= smoothstep(.99, 1.03, r) * (1. - .65 * flash);                 // the camera stops down when the sun peeks out
  col += mix(vec3(1., .97, .93), vec3(.86, .9, 1.), smoothstep(1., 3.5, r)) * I * .8 * (1. - moon);

  // chromosphere and a few small prominences (only seen past the moon's limb)
  float pr = prominence(ang, r, 2.6, .07, .05) + prominence(ang, r, .9, .045, .035)
           + prominence(ang, r, 4.4, .055, .06) + prominence(ang, r, 5.75, .035, .03);
  col += vec3(1., .2, .38) * (min(pr, 1.) * 1.3 + exp(-abs(r - 1.008) * 110.) * 1.6 * flash) * (1. - moon);

  // the exposed photosphere and its bloom
  vec2 b = -d / max(length(d), 1e-4);   // normalize() of the centred moon is NaN
  float db = length(p - b);
  col += vec3(1., .97, .92) * (exposed * 9. + flash * (.07 / (db * db + .003) + .3 * exp(-db * 1.5)));
  col += vec3(.06, .08, .14) * flash;

  col = mix(col, vec3(.004, .005, .009), moon);

  // as more photosphere returns the glare floods the frame (this is where the loop seam hides)
  float wo = smoothstep(.03, .05, abs(d.x));
  col += wo * (vec3(1., .97, .93) * 3. * exp(-db * .7) + vec3(.35, .45, .65));

  col = 1. - exp(-col * 1.3);
  col += (h21(frag * .9 + seed) - .5) * .022;            // film grain
  gl_FragColor = vec4(col, 1.);
}
</script>
<script>
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.bindAttribLocation(pr, 0, 'a');
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'res'), cv.width, cv.height);
  const uu = gl.getUniformLocation(pr, 'u'), us = gl.getUniformLocation(pr, 'seed');
  window.renderAt = (t, seed) => { gl.uniform1f(uu, t); gl.uniform1f(us, seed); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); };
  // opened directly in a browser it just plays (ping-pong instead of the baked crossfade)
  if (!navigator.webdriver) (function loop(ms){ const k = (ms / 16000) % 2; renderAt(k < 1 ? k : 2 - k, ms % 997); requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
