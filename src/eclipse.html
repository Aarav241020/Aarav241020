<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1200px; height: 420px; overflow: hidden; }
  canvas { display: block; }
  #name {
    position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
    font: 300 46px 'Cormorant Garamond', serif; letter-spacing: 22px; text-indent: 22px;
    color: #efeaff; text-shadow: 0 0 18px rgba(190, 170, 255, .45);
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1200" height="420"></canvas><div id="name">AARAV</div></div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;
uniform float t;            // loop phase 0..1
#define TAU 6.2831853

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float h31(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }

void main(){
  vec2 frag = gl_FragCoord.xy, uv = frag / res;
  float R = 54.;                                   // solar radius in px
  vec2 C = vec2(res.x * .5, res.y * .6);
  vec2 p = (frag - C) / R;
  float r = length(p), aa = 1.2 / R;
  vec2 dir = p / max(r, 1e-4);
  float ph = TAU * t; vec2 tc = vec2(cos(ph), sin(ph));   // circular time => seamless loop

  // sky: deep zenith, 360-degree twilight glow on the horizon (what totality really looks like)
  vec3 col = mix(vec3(.016, .018, .05), vec3(.004, .005, .016), smoothstep(.2, 1., uv.y));
  col += vec3(.8, .36, .14) * .9 * exp(-max(uv.y - .1, 0.) * 7.5);
  col += vec3(.25, .14, .35) * .25 * exp(-max(uv.y - .15, 0.) * 4.);

  // stars, washed out near the corona
  vec2 g = floor(frag / 7.); float hs = h21(g);
  if (hs > .965) {
    vec2 sp = (g + .2 + .6 * vec2(h21(g + 3.1), h21(g + 7.7))) * 7.;
    float tw = .55 + .45 * sin(ph * floor(1. + hs * 40. - 38.6) * 2. + hs * 90.);
    col += vec3(.85, .85, 1.) * smoothstep(1.3, 0., length(frag - sp)) * (hs - .965) * 28. * tw * smoothstep(1.6, 4.5, r);
  }

  // moon: sways just enough to expose the limb at the ends of the loop (diamond ring), lingers in totality
  float c = tc.x;
  vec2 d = vec2(.062 * c * pow(abs(c), 6.), .012 * tc.y);
  vec2 q = p - d; float rq = length(q);
  float am = atan(q.y, q.x);
  float Rm = 1.025 * (1. + .007 * (noise(vec3(cos(am) * 14., sin(am) * 14., 0.)) - .5));   // lunar mountains -> Baily's beads
  float moon = 1. - smoothstep(Rm - aa, Rm + aa, rq);
  float sun = 1. - smoothstep(1. - aa, 1. + aa, r);
  float exposed = sun * (1. - moon);
  float flash = smoothstep(.022, .06, abs(d.x));

  // corona: equatorial streamers + fine rays, evolving on a time circle
  vec2 td = vec2(dir.x * .955 - dir.y * .296, dir.x * .296 + dir.y * .955);   // tilted axis
  float eq = mix(.45, 1.5, pow(abs(td.x), 1.5));
  float body = fbm(vec3(dir * 2.4 + .28 * tc, log(r) * .7));
  float rays = fbm(vec3(dir * 11. + .18 * tc.yx, r * .12));
  float I = (pow(r, -2.7) * (.45 + 1.1 * body) + .5 * pow(r, -1.7) * pow(rays, 2.5)) * eq;
  I *= smoothstep(.98, 1.02, r) * (1. - .55 * flash);
  vec3 ccol = mix(vec3(1., .96, .9), vec3(.72, .76, 1.), smoothstep(1., 3.2, r));
  col += ccol * I * .9 * (1. - moon);

  // chromosphere + prominences peeking past the moon's limb
  float pr = smoothstep(.5, .78, fbm(vec3(dir * 5. + .12 * tc, 2.)));
  float ph_h = 1. + .11 * pow(pr, 1.3);
  float prom = (1. - smoothstep(ph_h - .012, ph_h, r)) * step(.999, r) * pr;
  float chrom = exp(-abs(r - 1.) * 70.) * .5;
  col += vec3(1., .22, .32) * (prom * 2.2 + chrom) * (1. - moon);

  // the exposed sliver of photosphere and its bloom
  col += vec3(1., .97, .9) * exposed * 6.;
  vec2 b = -vec2(sign(d.x), 0.);
  float db = length(p - b);
  col += vec3(1., .95, .86) * flash * (.1 / (db * db + .004) + .5 * exp(-db * 2.2));
  col += vec3(.9, .9, 1.) * flash * .006 / (abs(p.x - b.x) + .02) * exp(-abs(p.y - b.y) * .9);
  col += vec3(1., .93, .85) * flash * .02 / (abs(p.y - b.y) + .015) * exp(-abs(p.x - b.x) * .3);
  col += vec3(.06, .07, .12) * flash;

  // moon face: faint earthshine
  vec3 mcol = vec3(.014, .016, .03) * (.6 + .5 * fbm(vec3(q * 3., 5.)));
  col = mix(col, mcol, moon);

  // two mountain ridges, the far one hazed by atmosphere
  float x = uv.x;
  float r2 = .1 + .22 * fbm(vec3(x * 1.8 + 5., 1., 0.)) + .03 * fbm(vec3(x * 14., 2., 0.));
  float r1 = .01 + .22 * fbm(vec3(x * 2.6, 0., 0.)) + .04 * fbm(vec3(x * 18., 4., 0.));
  float px = 1. / res.y;
  col = mix(col, vec3(.07, .045, .07), 1. - smoothstep(r2 - px, r2 + px, uv.y));
  col = mix(col, vec3(.006, .006, .012), 1. - smoothstep(r1 - px, r1 + px, uv.y));

  col = 1. - exp(-col * 1.25);                        // tonemap
  col += (h21(frag + t) - .5) / 255.;                 // dither against banding
  gl_FragColor = vec4(pow(col, vec3(.95)), 1.);
}
</script>
<script>
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'res'), cv.width, cv.height);
  const ut = gl.getUniformLocation(pr, 't');
  window.renderAt = (t) => { gl.uniform1f(ut, t); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); };
  // opened directly in a browser it just plays
  if (!navigator.webdriver) (function loop(ms){ renderAt((ms / 8000) % 1); requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
